name: ci
# Offline: the tests use the committed model and its provenance file and need no dataset, so an
# outage at a data mirror cannot fail a commit. Real-data reproduction runs in reproduce.yml.
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-lock.txt pytest
      - run: MPLBACKEND=Agg pytest -q
